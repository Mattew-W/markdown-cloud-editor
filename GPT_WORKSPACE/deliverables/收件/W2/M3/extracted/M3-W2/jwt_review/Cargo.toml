[package]
name = "jwt_review"
version = "0.1.0"
edition = "2021"
description = "M3 W2 JWT regression review: existing token.rs working copy + boundary tests"
publish = false

[dependencies]
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
