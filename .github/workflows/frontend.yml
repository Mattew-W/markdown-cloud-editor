name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 【2026-11-15 修正：指向当前 frontend/ 而非 W1 归档区】
      #
      # 原实现跑的是 `GPT_WORKSPACE/deliverables/收件/W1/M6/正式模块草案_frontend`
      # —— 那是 W1 阶段 M6 的**归档副本**，与当前的 `frontend/` 无关。
      # 结果是：W1 之后所有前端改动（api.js / drafts.js / editor.js /
      # sync.js / app.js 及其全部测试）在这个 job 里**完全不被检查**。
      #
      # 本 job 定位为「草稿层专项测试」，与 ci.yml 的「frontend checks」
      # （全量前端测试）互补而不重复。
      - name: 安装前端依赖
        run: npm ci --prefix frontend

      - name: 草稿层专项测试
        shell: bash
        run: |
          set -e
          for f in \
            frontend/js/tests/drafts.test.js \
            frontend/js/tests/drafts.w4.test.js \
            frontend/js/tests/drafts.gap.test.js
          do
            if [ ! -f "$f" ]; then
              echo "::error::缺少草稿层测试文件：$f"
              exit 1
            fi
            echo "=== $f ==="
            node --test "$f"
          done
