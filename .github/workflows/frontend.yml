name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run frontend draft unit tests when present
        shell: bash
        run: |
          test_file="GPT_WORKSPACE/deliverables/收件/W1/M6/正式模块草案_frontend/tests/unit/drafts.test.js"
          if [ -f "$test_file" ]; then
            node --test "$test_file"
          else
            echo "No frontend draft test suite exists in this branch; frontend tests were skipped."
          fi
