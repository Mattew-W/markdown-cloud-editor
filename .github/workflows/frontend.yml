name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Verify drafts module has no DOM operations
        shell: bash
        run: |
          if grep -nE 'document\.|getElementById|addEventListener' frontend/js/drafts.js; then
            echo "::error::frontend/js/drafts.js contains DOM operations"
            exit 1
          fi
