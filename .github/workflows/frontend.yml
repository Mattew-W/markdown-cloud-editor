name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run frontend draft unit tests when present
        shell: bash
        run: |
          module_dir="GPT_WORKSPACE/deliverables/收件/W1/M6/正式模块草案_frontend"
          test_file="$module_dir/tests/unit/drafts.test.js"
          if [ -f "$test_file" ]; then
            node --test "$test_file"
          elif [ -d "$module_dir" ]; then
            echo "::error::Frontend module exists but its required unit test file is missing."
            exit 1
          else
            echo "Frontend draft module has not landed yet; tests are not applicable."
          fi
