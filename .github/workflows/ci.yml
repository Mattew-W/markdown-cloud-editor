# Rust CI
#
# 规范 §11 规定的四条必检命令，全部真实执行：
#   cargo fmt --check
#   cargo clippy --locked --all-targets -- -D warnings
#   cargo test --locked
#   cargo doc --locked --no-deps
#
# 关键约束（均为规范硬性要求，勿简化）：
#   · --locked 要求仓库内已有 Cargo.lock。应用 crate 的 lock 文件必须入库，
#     否则 CI 全红。本仓库已在首次提交中包含 Cargo.lock。
#   · RUSTDOCFLAGS=-D warnings + 库级 #![warn(missing_docs)]：
#     公开项缺 Rustdoc 会让文档任务失败。
#   · 缺少 Cargo.toml、测试服务不可用或必需脚本未配置，必须**明确失败**，
#     不得报告为通过；禁止添加总是成功的占位脚本。
#   · 单元测试用可控时钟模拟防抖与重试，不依赖真实等待。
#
# 状态检查名称固定为 `Rust checks`，与 `Frontend checks` 一并作为分支必需检查。

name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt / clippy / test / doc
    # 【为什么用 ubuntu-latest 而不是 windows-latest】
    # 本 job 需要 PostgreSQL service container，而 GitHub Actions 的
    # service container **仅在 Linux runner 上可用**（windows-latest 会报
    #   Container operations are only supported on Linux runners）。
    # 该问题已于 2026-10-21 实测发现并修正：初版配 windows-latest + services，
    # 导致 job 在 10 秒内直接失败。
    # 本地开发环境为 Windows，与 runner 平台无关——四条必检命令行为一致。
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 规范 §11：使用临时 PostgreSQL 服务、独立测试数据库和迁移步骤。
    # 不得借用开发者数据库或生产密钥。
    # §12：最终验收必须连接真实后端和数据库，故本 job 必定真实执行。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # 本 job 的一次性测试密码，非任何真实凭据。
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 规范要求本地与 CI 使用同一数据库主版本。
      # service container 的主机名在 Linux runner 上为 localhost。
      TEST_DATABASE_URL: postgres://postgres:ci_test_password@localhost:5432/mce_test
      DATABASE_URL: postgres://postgres:ci_test_password@localhost:5432/mce_test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Windows runner 默认工具链即 msvc，无需额外指定。
      # rust-toolchain 文件中的 target 会被自动应用。
      - name: 显示工具链信息
        run: |
          rustc --version --verbose
          cargo --version

      - name: 缓存 cargo 依赖与构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # 规范 §11：迁移与测试指向同一测试 schema。
      - name: 应用数据库迁移
        # 迁移必须在真实 PostgreSQL 上执行，失败即整体失败（ON_ERROR_STOP=1）。
        # 用 PGPASSWORD 环境变量传口令，避免把口令写进命令行历史。
        # 变量赋值写法（`KEY=value command` 前缀）仅 POSIX shell 支持，
        # 因此本步骤不指定 shell，Linux runner 默认 bash。
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -f migrations/0001_init.sql

      # 迁移落地后核对：表与索引是否真的建出来了。
      # 缺 Cargo.toml、测试服务不可用或必需脚本未配置必须明确失败，
      # 不得报告为通过（规范 §11）。
      - name: 核对迁移结果
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            -c "SELECT indexname FROM pg_indexes WHERE tablename='documents';"

      # 断言式约束验证 + 零残留核对（必检）。
      # 与上面的「核对迁移结果」不同：那个只看表和索引建出来了，这个逐条断言
      # **约束真的按预期触发**——捕获 RETURNED_SQLSTATE 并与预期比较，
      # 错误码不同或根本没报错都使整轮失败。
      #
      # 规范 §12：约束必须实测而非只看 SQL 定义。
      # 脚本在单一 BEGIN/ROLLBACK 中运行夹具与检查，结束回滚，不污染业务表。
      # 本地已于 PostgreSQL 17.11 实测：11/11 PASS，两遍可重复，零残留。
      #
      # 残留核对采用**跨检查取样**：BEFORE 取自检查执行之前，AFTER 取自之后。
      # 若把 BEFORE 放在检查之后，两次取样必然相等，检测形同虚设。
      # 用前后对比而非绝对值 0：public schema 将来若有种子数据，绝对 0 会误报失败。
      - name: 断言式约束验证与零残留核对
        env:
          PGPASSWORD: ci_test_password
        run: |
          COUNT_SQL="SELECT (SELECT count(*) FROM users) || ',' || (SELECT count(*) FROM documents);"
          BEFORE=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 -c "$COUNT_SQL")
          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -f migrations/checks/run_checks.sql
          AFTER=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 -c "$COUNT_SQL")
          echo "before=${BEFORE} after=${AFTER}"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::约束验证脚本留下残留数据：before=${BEFORE} after=${AFTER}"
            exit 1
          fi

      # ---------- W3 隔离回归（必检） ----------
      #
      # W3 回归在**独立临时 schema**（t_w3_ci_*）中执行冻结迁移 0001_init.sql，
      # 不写 public、不依赖现有用户数据——这是与上面断言式验证的根本区别。
      #
      # 本地已于 PostgreSQL 17.11 实测：10/10 PASS，三遍可重复，
      # public 预置数据时仍 10/10 且数据不变。
      #
      # 残留检测查两项（不能用 public.users —— W3 从不在 public 建表，
      # 该表在此库中可能根本不存在，查它会直接报错）：
      #   (a) 不存在残留的 t_w3_* 临时 schema；
      #   (b) public 中若原本存在 users/documents，其行数前后一致。
      #
      # public 计数必须**先判存在再查**：不能把子查询写进 CASE 的 ELSE 分支，
      # PostgreSQL 会提前解析该分支，即使走不到也报「关系 public.users 不存在」。
      - name: W3 隔离回归
        env:
          PGPASSWORD: ci_test_password
        run: |
          W3_SCHEMA="t_w3_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          public_count() {
            local has
            has=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
              -c "SELECT CASE WHEN to_regclass('public.users') IS NULL THEN 'none' ELSE 'present' END;")
            if [ "$has" = "none" ]; then echo "none"; return 0; fi
            psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
              -c "SELECT (SELECT count(*) FROM public.users)::text || ',' || (SELECT count(*) FROM public.documents)::text;"
          }

          BEFORE=$(public_count)

          # 主回归：必须成功且输出全部通过的标志。
          #
          # 注意：psql 的 NOTICE（RAISE NOTICE）输出到 **stderr**，不是 stdout。
          # 若用 `| tee file`，日志只含 stdout，grep 必然找不到标志而误报失败。
          # 故此处用 `> file 2>&1` 同时捕获两路。
          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -v "w3_schema=${W3_SCHEMA}" \
            -f migrations/checks/w3/run_w3_regression.sql \
            > /tmp/w3_regression.log 2>&1
          cat /tmp/w3_regression.log
          grep -q "ALL W3 REGRESSION CHECKS PASSED" /tmp/w3_regression.log || {
            echo "::error::W3 回归未输出 ALL W3 REGRESSION CHECKS PASSED"
            exit 1
          }

          # 失败路径也可能留下 schema，这里兜底清理
          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS \"${W3_SCHEMA}\" CASCADE;" >/dev/null

          AFTER=$(public_count)
          LEFT=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_namespace WHERE nspname LIKE 't_w3%';")

          echo "public before=${BEFORE} after=${AFTER}  残留 t_w3_* schema 数=${LEFT}"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::W3 回归改动了 public 数据：before=${BEFORE} after=${AFTER}"
            exit 1
          fi
          if [ "$LEFT" != "0" ]; then
            echo "::error::W3 回归留下 ${LEFT} 个临时 schema"
            exit 1
          fi

      # ---------- W4 数据层回归（必检） ----------
      #
      # W4 验证现有 PostgreSQL CRUD 约束与 CAS 写入语义：
      #   M2-01 唯一临时 schema / 前后行数一致 / 失败路径清理
      #   M2-02 RESTRICT 23503、合法不存在 UUID 23503、非法 UUID 22P02
      #   M2-03 owner+id+expected_version 原子更新 1 行 / 0 行
      #   M2-05 同时间戳稳定分页、用户过滤、索引定义覆盖
      #
      # 本地已于 PostgreSQL 17.11 实测：11/11 PASS，两遍可重复，零残留。
      #
      # 两处实现要点（均为 M1 在接入时踩过并修复的坑）：
      #   1. psql 的 NOTICE（RAISE NOTICE）输出到 **stderr**，不是 stdout。
      #      用 `| tee file` 捕获日志会导致 grep 找不到成功标志而误报失败，
      #      故此处用 `> file 2>&1` 同时捕获两路。
      #   2. 残留检测不能查 `public.users` —— W4 从不在 public 建表，
      #      该表在此库中可能根本不存在，查它会直接报错。
      #      应查「无残留 t_w4_* schema」+「public 若有表则行数前后一致」。
      - name: W4 数据层回归
        env:
          PGPASSWORD: ci_test_password
        run: |
          W4_SCHEMA="t_w4_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          public_count() {
            local has
            has=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
              -c "SELECT CASE WHEN to_regclass('public.users') IS NULL THEN 'none' ELSE 'present' END;")
            if [ "$has" = "none" ]; then echo "none"; return 0; fi
            psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
              -c "SELECT (SELECT count(*) FROM public.users)::text || ',' || (SELECT count(*) FROM public.documents)::text;"
          }

          BEFORE=$(public_count)

          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -v "w4_schema=${W4_SCHEMA}" \
            -f migrations/checks/w4/run_w4_regression.sql \
            > /tmp/w4_regression.log 2>&1
          cat /tmp/w4_regression.log
          grep -q "ALL W4 REGRESSION CHECKS PASSED" /tmp/w4_regression.log || {
            echo "::error::W4 回归未输出 ALL W4 REGRESSION CHECKS PASSED"
            exit 1
          }

          psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS \"${W4_SCHEMA}\" CASCADE;" >/dev/null

          AFTER=$(public_count)
          LEFT=$(psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_namespace WHERE nspname LIKE 't_w4%';")

          echo "public before=${BEFORE} after=${AFTER}  残留 t_w4_* schema 数=${LEFT}"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::W4 回归改动了 public 数据：before=${BEFORE} after=${AFTER}"
            exit 1
          fi
          if [ "$LEFT" != "0" ]; then
            echo "::error::W4 回归留下 ${LEFT} 个临时 schema"
            exit 1
          fi

      # ---------- W5 数据库联调回归（必检） ----------
      #
      # W5 在 W2/W3/W4 基础上补齐「败者归因」：
      #   W4 只断言影响行数集合 {1,0}；W5 额外记录双方起跑版本、
      #   败方在双方尝试完成后回读到的版本与正文，并断言最终行
      #   只反映一次写入、败方内容未落库。
      #
      # runner（run_w5_regression.ps1）自带残留与挂起连接核查：
      #   * 每次生成唯一 t_w5_* schema，finally 中删除**本轮那个** schema
      #   * 报告「本轮 schema 残留数」「库内 t_w5_* 总残留数」
      #   * 报告 application_name 匹配的**挂起连接数**
      # 残留或挂起连接非 0 即判失败。
      #
      # 三个入口进 CI 必检：主回归、索引检查、负向对照。
      #   负向对照要求 psql 退出码 3、命中指定 SQLSTATE 断言、
      #   临时 schema 和连接都已清理。
      #
      # 并发与限流轮次**不进 CI 必检**（需双进程时间同步 / 20 轮耗时，
      # CI 抖动会影响稳定性），保留为手动复测命令。
      - name: W5 主回归
        env:
          PGPASSWORD: ci_test_password
        run: |
          pwsh -NoProfile -File migrations/checks/w5/run_w5_regression.ps1 \
            -Database mce_test -Psql psql
          psql -h localhost -U postgres -d mce_test -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_namespace WHERE nspname LIKE 't\_w5\_%';" \
            | grep -qx '0' || { echo "::error::W5 回归留下临时 schema"; exit 1; }

      - name: W5 索引检查
        env:
          PGPASSWORD: ci_test_password
        run: |
          pwsh -NoProfile -File migrations/checks/w5/run_w5_regression.ps1 \
            -Database mce_test -Psql psql -Entry index/run_w5_index.sql

      - name: W5 负向对照（预期失败被检出）
        env:
          PGPASSWORD: ci_test_password
        run: |
          pwsh -NoProfile -File migrations/checks/w5/run_w5_regression.ps1 \
            -Database mce_test -Psql psql \
            -Entry negative_control/run_w5_negative_control.sql -ExpectFailure

      # ---------- 必检 1/4：格式 ----------
      - name: cargo fmt --check
        run: cargo fmt --check

      # ---------- 必检 2/4：静态检查（警告视为错误） ----------
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # ---------- 必检 3/4：测试 ----------
      # 不加 --all-targets 时 cargo test 默认只跑 bin target，
      # 库内单测会被静默跳过（退出码仍为 0）。此处显式覆盖全部目标。
      - name: cargo test
        run: cargo test --locked --all-targets

      # 数据库集成测试默认 #[ignore]（无本地库时跳过）。
      # CI 有 postgres 服务容器，故此处**必定真实执行**——
      # 规范 §11/§12 不允许这些用例被静默跳过。
      #
      # 每个用例建自己的 schema（t_% 前缀）以获得并行隔离，
      # 用例内不删除；运行前后各清一次，保证 CI 反复运行不残留。
      - name: 清理上次遗留的测试 schema
        env:
          PGPASSWORD: ci_test_password
        run: psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 -f migrations/cleanup_test_schemas.sql

      - name: cargo test（真实数据库）
        run: cargo test --locked --all-targets -- --ignored

      - name: 清理本次产生的测试 schema
        env:
          PGPASSWORD: ci_test_password
        run: psql -h localhost -U postgres -d mce_test -v ON_ERROR_STOP=1 -f migrations/cleanup_test_schemas.sql

      # ---------- 必检 4/4：文档 ----------
      - name: cargo doc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ------------------------------------------------------------------
  # 前端检查
  #
  # 规范 §11 把前端 JS 单列一类。drafts.js 是 M6 交付物，
  # 其六条硬约束（零 DOM、不读 token、存储注入）由测试保证。
  #
  # 【为什么本 job 不用 actions/setup-node】
  # 2026-10-21 实测：写 `cache: 'none'` 时 setup-node@v4 会报
  #   ##[error]Caching for 'none' is not supported
  # 导致 job 在 5 秒内失败。GitHub runner 已预装 Node，
  # 因此直接用 `node --test`，不引入 setup-node 步骤。
  #
  # 【2026-11-15 修正：必须 npm ci】
  # 原注释称"本项目前端零运行时依赖，无需 npm install"——
  # **该前提已不成立**：`package.json` 的 devDependencies 现有
  # jsdom（`app.test.js` 需要它构造 DOM 环境）、
  # marked 与 dompurify（`editor.security.test.js` 需要真实净化器）。
  # 原 job 只跑 `drafts.test.js` 一个文件，
  # 导致 M5 W4 交付的全部测试与 M1 W4 新增的 sync/app 测试
  # **在 CI 上完全没有覆盖**。
  # 现改为 `npm ci` + 跑全部前端测试。
  # ------------------------------------------------------------------
  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Node 版本
        run: node --version

      # 依赖必须安装：devDependencies 里的 jsdom 是 app.test.js 的运行前提。
      # 用 `npm ci` 而非 `npm install`：前者严格按 package-lock.json 安装，
      # 保证 CI 与本机装到完全相同的版本。
      - name: 安装前端依赖
        run: npm ci --prefix frontend

      # 跑**全部**前端测试：api / api.http / drafts / drafts.w4 / drafts.gap /
      # editor.* / interop / sync / app。
      - name: 前端全部单元测试
        run: npm test --prefix frontend

      # 硬约束的机器校验：drafts.js 不得出现 DOM 操作。
      # 这条比人眼审阅可靠——M6 W1 就因直接操作 DOM 被判返工。
      - name: 校验 drafts.js 零 DOM
        run: |
          if grep -nE 'document\.|getElementById|addEventListener' frontend/js/drafts.js; then
            echo "::error::drafts.js 出现 DOM 操作，违反 INTERFACES.md §2.2 硬约束 1"
            exit 1
          fi
          echo "零 DOM 校验通过"
