[package]
name = "gemini-markdown-cloud-editor"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Production-grade Web-based Markdown Cloud Editor with Gemini 3.8 Flash AI Copilot"
license = "MIT"

[lib]
name = "gemini_markdown_cloud_editor"
path = "src/lib.rs"

[[bin]]
name = "gemini-markdown-cloud-editor"
path = "src/main.rs"


[dependencies]
actix-web = "4.11"
actix-files = "0.6"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

argon2 = "0.5"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
actix-rt = "2"
actix-http = "3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
